<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habyt</title>
  <meta name="description" content="Habyt – szokáskövető esti check-innel, naptárral és streakekkel.">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habyt">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Fő navigáció">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="32" height="32">
        <span>Habyt</span>
      </div>
      <a href="#ma" data-route="ma">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9"/></svg>
        <span>Ma</span>
      </a>
      <a href="#szokasok" data-route="szokasok">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg>
        <span>Szokások</span>
      </a>
      <a href="#statisztika" data-route="statisztika">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg>
        <span>Statisztika</span>
      </a>
      <a href="#beallitasok" data-route="beallitasok">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Beállítások</span>
      </a>
    </nav>

    <main>
      <section id="view-ma" class="view" hidden></section>
      <section id="view-szokasok" class="view" hidden></section>
      <section id="view-statisztika" class="view" hidden></section>
      <section id="view-beallitasok" class="view" hidden></section>
    </main>
  </div>

  <dialog id="habit-dialog" aria-labelledby="dlg-title">
    <form id="habit-form" method="dialog">
      <h2 id="dlg-title">Új szokás</h2>

      <label class="field">
        <span>Név</span>
        <input id="f-name" type="text" maxlength="60" placeholder="pl. Olvass 20 percet" autocomplete="off" required>
      </label>

      <div class="field">
        <span>Ikon</span>
        <div class="icon-picker">
          <input id="f-icon" type="text" maxlength="4" aria-label="Saját emoji">
          <div id="f-icon-quick" class="icon-quick"></div>
        </div>
      </div>

      <label class="field">
        <span>Kategória</span>
        <select id="f-cat"></select>
      </label>

      <div class="field">
        <span>Mely napokon?</span>
        <div id="f-days" class="day-toggles"></div>
        <div class="day-presets">
          <button type="button" class="link-btn" data-preset="all">Minden nap</button>
          <button type="button" class="link-btn" data-preset="weekdays">Hétköznap</button>
          <button type="button" class="link-btn" data-preset="weekend">Hétvégén</button>
        </div>
      </div>

      <p id="f-error" class="form-error" role="alert"></p>

      <div class="dlg-actions">
        <div class="dlg-danger">
          <button type="button" class="btn btn-ghost btn-sm" id="f-archive">Archiválás</button>
          <button type="button" class="btn btn-danger btn-sm" id="f-delete">Törlés</button>
        </div>
        <div class="dlg-main">
          <button type="button" class="btn btn-ghost" id="f-cancel">Mégse</button>
          <button type="submit" class="btn btn-primary" id="f-save">Mentés</button>
        </div>
      </div>
    </form>
  </dialog>

  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/storage.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/suggest.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
